<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Create your StudyHub account to start sharing and discovering study notes.">
  <title>Sign Up - StudyHub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/auth.css">
  <link rel="stylesheet" href="../css/global.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-container">
      <div class="auth-card">
        <div class="auth-header">
          <a href="/" class="auth-logo">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path>
              <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path>
            </svg>
            StudyHub
          </a>
          <h1>Create your account</h1>
          <p>Join thousands of students sharing notes</p>
        </div>

        <div class="auth-body">
          
          <form class="auth-form" id="signupForm">
            <div class="form-row">
              <div class="form-group">
                <label class="form-label" for="firstName">First Name</label>
                <input type="text" id="firstName" name="firstName" class="form-input" placeholder="John" required>
              </div>
              <div class="form-group">
                <label class="form-label" for="lastName">Last Name</label>
                <input type="text" id="lastName" name="lastName" class="form-input" placeholder="Doe" required>
              </div>
            </div>

            <div class="form-group">
              <label class="form-label" for="email">Email</label>
              <input type="email" id="email" name="email" class="form-input" placeholder="john@university.edu" required>
            </div>

            

            <div class="form-group">
              <label class="form-label" for="password">Password</label>
              <div class="password-field">
                <input type="password" id="password" name="password" class="form-input" placeholder="Create a password" required minlength="8">
                <button type="button" class="password-toggle" id="togglePassword" aria-label="Toggle password visibility">
                  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                  </svg>
                </button>
              </div>
              <p class="form-hint">Must be at least 8 characters</p>
            </div>

            <div class="form-group">
              <label class="form-checkbox">
                <input type="checkbox" name="terms" required>
                <span>I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a></span>
              </label>
            </div>

            <button type="submit" class="btn btn-primary">Create Account</button>
          </form>
        </div>

        <div class="auth-footer">
          <p>Already have an account? <a href="/pages/login.html">Log in</a></p>
        </div>
      </div>
    </div>
  </div>

  <script src="../js/auth.js"></script>
</body>
</html>
